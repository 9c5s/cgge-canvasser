[project]
name = "cgge-canvasser"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "googlemaps>=4.10",
  "playwright>=1.51.0",
  "pycryptodome>=3.19",
  "python-dotenv>=1.0",
  'tzdata>=2024.1; sys_platform == "win32"',
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.coverage.run]
source = ["."]
# カバレッジ率を実装コードの実態に合わせるため、テスト自身は計測から外す
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# テストは private 関数を直接検証する (ruff 側の SLF001 除外と対) ため、
# reportPrivateUsage のみ緩める。
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
preview = true
include = ["*.py", "*.pyi", "**/pyproject.toml"]
respect-gitignore = true
show-fixes = true
output-format = "full"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 72

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D415",
  "ERA001",
]
fixable = ["ALL"]
preview = true
explicit-preview-rules = true
typing-modules = ["typing", "typing_extensions"]
allowed-confusables = ["ノ"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-dummy-args = false
suppress-none-returning = false
mypy-init-return = true

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = false

[tool.ruff.lint.flake8-errmsg]
max-string-length = 30

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "csv"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
avoid-escape = true

[tool.ruff.lint.flake8-self]
ignore-names = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true
exempt-modules = ["typing", "typing_extensions"]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
  "attrs.define",
  "attrs.frozen",
  "dataclasses.dataclass",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = false

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
combine-as-imports = true
split-on-trailing-comma = true
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
  "classmethod",
  "pydantic.validator",
  "pydantic.field_validator",
]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88
ignore-overlong-task-comments = false

[tool.ruff.lint.pydocstyle]
convention = "google"
property-decorators = [
  "property",
  "cached_property",
  "functools.cached_property",
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float"]
max-args = 5
max-bool-expr = 3
max-branches = 10
max-locals = 10
max-nested-blocks = 3
max-positional-args = 3
max-public-methods = 20
max-returns = 5
max-statements = 35

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG",
  # 日本語テスト名 (ドキュメント性優先) と、それに伴う小文字始まり規約の除外
  "D403",
  "FBT",
  "INP001",
  "N802",
  "PLC2401",
  "PLC0415",
  "PLR0913",
  "PLR2004",
  "S101",
  "S105",
  "S106",
  "S108",
  "SLF001",
  "TC003",
  "TRY003",
]

[tool.uv]
package = false
